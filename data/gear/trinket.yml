  location: Mundus Nullius system - Ruined Palace
  act: 4
  description: >-
    Uses AGI instead of INT, TGH instead of WP, STR instead of FEL. Immunity to injuries and traumas. Regenerates TGH/2
    wounds per turn. +25STR, TGH, AGI and PER. When wearer kills enemy any dmg they deal is increased by +1% until the
    end of combat, while their INT, WP, FEL are reduced by -1(no less than 1) until the end of combat
- name: Bayonet Chain Knife
  slot: trinket
  location: Quetza Temer
  act: 4
  description: >-
    When wearer attacks a target with any ranged weapon in a 1-cell range that attack inflicts bleeding (10). The target
    also suffers +25% critical damage to all attacks made against it.
- name: Emerald Cherub Ring
  slot: trinket
  location: World event reward - Hundred Dreams Crossroads - Ice World Melting the ice
  act: 4
  description: >-
    This ring grants the wearer a +5 bonus to Fellowship Tests. It also increases Momentum by 1 for each kill made by
    the wearer.
- name: Empyrean Transceiver
  slot: trinket
  location: Kieva Gamma Colony event reward
  act: 4
  description: When targeted by Ally's ability, gain Ally's FEL Temp. Wounds
- name: Echo of Victory
  slot: trinket
  location: Dargonus Colony Event Reward
  act: 4
  description: >-
    When attacking a target within 5 cells with a ranged weapon, the character deals (10 + armor penetration/3)% more
    damage.
- name: Blood Barrier Emitter
  slot: trinket
  location: Quetza Temer - Tervantias Lab
  act: 4
  description: >-
    At the start of their turn, the wearer recovers wounds equal to the number of bleeding creatures. If at least 1
    wound was recovered that way, 1 fresh injury is removed from the wearer
- name: Litany of the Empyrean Fury
  slot: trinket
  location: (Void Shadows DLC) Explorators
  act: 4
  description: >-
    Each psychic power or navigator power used by a character's ally additionally deals direct damage to all enemies in
    combat equal to (ally's resolve)
- name: Impenetrable cover
  slot: trinket
  location: (Void Shadows DLC) Kasballica Mission
  act: 4
  description: Reduces the hit chance of all ranged attacks against the character and his allies by (3 x Resolve)
- name: Voidborn's Pride
  slot: trinket
  location: (Void Shadows DLC) Dargonus, a gift from Clan Erabis
  act: 4
  description: >-
    A clan heirloom of the Erebis family, it served its former owners faithfully during voidship boardings. The
    inscription engraved on the hull reads: "May Naaki and Mattis preserve the light of your souls." When a character
    kills an enemy, their Medicae is increased by (2 x Resolve) until the end of the battle. This effect stacks.
- name: Empyrean Grasp
  slot: trinket
  location: (Void Shadows DLC) Fight the Triumph of Slaughter in the Agatus Archides system
  act: 4
  description: Increases Critical Hit Chance and Melee Critical Damage by (Veil Thinning)%
- name: Portable energy storage
  slot: trinket
  location: (Lex Imperialis DLC) Explorators
  act: 4
  description: >-
    If a character is an Overseer, they can use Recharge (ultimate ability) multiple times per battle, but no more than
    once per round. The bonuses from this ability do not stack.
- name: Durable shield straps
  slot: trinket
  location: (Lex Imperialis DLC) Fellowship of the void
  act: 4
  description: >-
    When using Stalwart Defense, the character gains 3 levels of this ability's effect. Blocking an attack from a marked
    enemy consumes one level. The block bonus remains the same as the regular version of the ability and lasts as long
    as the character has at least one level of Stalwart Defense. The character's counterattacks with this ability
    receive a +25% critical hit chance.
- name: Excerpt from Tactica Imperialis
  slot: trinket
  location: (Lex Imperialis DLC) Only available if you did not bring solomorne to act 3
  act: 4
  description: >-
    The character's critical damage with pistols is increased by (Knowledge: Imperium / 5)% if the character's
    Knowledge: Imperium is greater than or equal to 150.
- name: Vid-Capture Relay
  slot: trinket
  location: Pasqal personal quest location
  act: 4
  description: >-
    Whenever the wearer's ally is under the effect of Joint Analysis and hits a target with explit the wearer gains +5
    Perception
- name: Ring of Meragon
  slot: trinket
  location: (Lex Imperialis DLC) Palace of Justice, in an excavated chest under the scales statue after the battle
  act: 4
  description: >-
    When a character kills a target for the first time in a round, their next attack automatically hits. Also, if they
    are an Arbiter, Arbiter abilities used this round can be reused. The ring is adorned with finely crafted gold
    letters: "Severius Meragon, first marshal of this Temple of the Lex Imperialis, who dispensed righteous judgment
    until the Emperor called his soul."
- name: Relic Silencer
  slot: trinket
  location: Tomb world Epitaph
  act: 5
  description: Wearer does not lose the Elusive effect if they attack from cover
- name: Cruciatum Litany
  slot: trinket
  location: Tomb world Epitaph
  act: 5
  description: Each of the wearer's single attacks gains +10% damage for each negative effect on the target
- name: Rosary of Defence
  slot: trinket
  location: Tomb world Epitaph
  act: 5
  description: Wearer has a unyielding beacon stack% chance to ignore any incoming damage
- name: Combi-Tool
  slot: trinket
  location: Ancient Bunker, Oasis V, Nameless Star system
  act: null
  description: >-
    Commonly found in the hands of the Adeptus Mechanicus cult members, combi-tools are versatile, if somewhat bizarre,
    mechanical devices. Grants +5 to Tech-Use Tests.
- name: Flamer Digi-Weapon
  slot: trinket
  location: Kiava Gamma — right wing of building (two chests), also room behind cogitator bridge (Cache on Kiava Gamma rumour)
  act: null
  description: >-
    A marvellous compact weapon in a form of a ring allows to fire a stream of flame in a short range. Reloading of
    Digi-weapon is extremely complicated task and can be performed only on the ship.
- name: Forbidden Xenos Compendium
  slot: trinket
  location: null
  act: null
  description: >-
    This scripture contains research data and observations on some Xenos species. Grants a +5 bonus to Lore (?enos)
    Tests.
- name: Heart of the Nameless
  slot: trinket
  location: Janus — possible reward for Chronicle of the Protectorated Decision quest
  act: null
  description: This item increases Absorption against xeno-enemies by 10%.
- name: Imperial Scroll
  slot: trinket
  location: Purchased from Hieronymus Doloroso
  act: null
  description: This scroll contains imperial orders from the old days and grants the owner a +5 bonus to Lore (Imperium) Tests.
- name: Instability Detonator
  slot: trinket
  location: Kiava Gamma — after completing The Motive Force Is Life colony project
  act: null
  description: >-
    This item grants its wearer a +5 bonus to Tech-use tests. Once per battle: can be used to immediatly remove all
    Burning and Bleeding effects from enemies in a 10 cell radius. This enemies receive 15+(wearer's Tech-Use)/10
    Explosive Damage (with a Penetration of 4).
- name: Shifting Combi-Tool
  slot: trinket
  location: Quest reward — given by Fabricator-Censor Cubis Delphim, Flame in the Dark
  act: null
  description: >-
    Commonly found in the hands of the Adeptus Mechanicus cult members, combi-tools are versatile, if somewhat bizarre,
    mechanical devices. Grants +10 to Tech-Use Tests
- name: Stimulant Injector
  slot: trinket
  location: Footfall Atrium — Underworld Quest reward
  act: null
  description: This item reduces Wounds by 6, yet increases Righteous Fury chance by 10%.
- name: Target Designator
  slot: trinket
  location: Purchased from Opticon-22
  act: null
  description: Whenever wearer hits target with Deadeye Shot, reduce Enemy deflection -1 and stack +1 exploit. Stacks up to 3 times
