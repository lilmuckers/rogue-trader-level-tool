# Bionic Augments — The Infinite Museion DLC
# Installed via the Sector Bionica voidship compartment. Once implanted, an
# augment cannot be removed — only replaced. Most augments grant a major
# positive effect alongside a negative drawback and/or tradeoff.
# Slot categories: head, torso, hand, leg (6 base slots: 2x head, 1x torso, 2x hand, 1x leg)
# Some augments are character-specific (Pasqal, Eogunn).

- name: Bionic Eye Implant
  slot: augment
  category: Head — Optical
  description: "+3 Perception. Drawback: -3 Ballistic Skill, -3 Intelligence."
- name: Cerebral Holo-Ocular (MK-I)
  slot: augment
  category: Head — Optical
  description: "Creates tactical decoys when moving. Drawback: Fellowship -10%."
- name: Focal Emitter (MK-I)
  slot: augment
  category: Head — Optical
  description: "Automatic follow-up shots after attacks. Drawback: Intelligence -10%."
- name: Ballistic Calculator
  slot: augment
  category: Head — Optical
  description: "Replaces overpenetration with ricochet. Drawback: cannot use burst attacks."
- name: Cerebral Inverter (MK-I)
  slot: augment
  category: Head — Cortical/Synaptic
  description: "Uses Intelligence instead of Strength for damage. Drawback: Toughness -10%."
- name: Grey Hood
  slot: augment
  category: Head — Cortical/Synaptic
  description: "Unsanctioned Psyker only. Reduces peril triggers. Drawback: removes Horrors effect."
- name: Adaptive Hemo-Filter (MK-I)
  slot: augment
  category: Torso — Somatic
  description: "Combat stimulants no longer cause negative effects, and grant healing when self-targeted."
- name: Neural System Graft (MK-I)
