  description: "+30% melee damage based on traumas suffered. Drawback: Toughness -10%."
- name: Weapon Optimiser (MK-I)
  slot: augment
  category: Torso — Somatic
  description: "Weapon-type-specific bonuses. Tradeoff: user gains +3 Ferrum Sanctum."
- name: Regenerative Matrix
  slot: augment
  category: Torso — Somatic
  description: "Wearer cannot suffer traumas. Drawback: stunned for 1 round when injured."
- name: Kinetic Force Conduit
  slot: augment
