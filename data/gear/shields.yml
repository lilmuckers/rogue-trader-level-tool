- name: Special Privilege
  slot: weapon
  location: Loot in Spire of the Reaving Tempest (Exterior)
  act: 3
  description: >-
    After leaving a Combat Tactics area, the wielder retains its effects until moving into another Combat Tactics area.
    Block chance 30%.
  category: Shield

- name: Stronghold
  slot: weapon
  location: Loot in Starport
  act: 3
  description: Whenever the wielder blocks an attack, gain (2 x TGH bonus) temporary wounds. Block chance 25%.
  category: Shield

- name: Shield of Unfaltering Will
  slot: weapon
  location: Loot in Leethus
  act: 4
  description: Successful attacks of opportunity inflict Immobilise on the target. Block chance 40%.
  category: Shield

- name: Kinesiostatic Shield
  slot: weapon
  location: Obtained from conversation with Marshal Gregoras Strachs and Solomorne (Lex Imperialis DLC)
  act: 4
  description: >-
    +1 deflection and +(2 x WS bonus)% parry. Blocking attacks generates kinesiostatic stacks equal to blocked damage.
    Shield attacks deal additional energy damage equal to stacks (50% armour penetration), then consume all stacks.
    Block chance 35%.
  category: Shield

- name: Last Stand
  slot: weapon
  act: 3
  description: >-
    While the wielder has less than 4 traumas and an adjacent ally still in combat, wounds cannot drop below 1.
    Each instance of lethal damage inflicts a random trauma instead. Block chance 40%.
  category: Shield

- name: Insulator Shield
  slot: weapon
  act: 3
  description: Incoming energy, fire, and shock damage reduced by 35%. Block chance 25%.
  category: Shield

- name: Hardened Shield
  slot: weapon
  act: 2
  description: +1 deflection and +6% parry. First Shield Bash per turn costs 0 AP. Block chance 22%.
  category: Shield

- name: Defender
  slot: weapon
  act: 3
  description: >-
    Grants 12 temporary wounds per adjacent ally. Transfers a portion of ally damage to the wielder. Block chance 40%.
  category: Shield

- name: Flames of Retribution
  slot: weapon
  act: 3
  description: >-
    The wielder burns and inflicts burning on adjacent creatures each round. Extra fire damage to xenos and daemons.
