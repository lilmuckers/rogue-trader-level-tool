  act: 3
  description: +1 deflection and +(2 x WS bonus)% parry. First Shield Bash per turn costs 0 AP. Block chance 30%.
  category: Shield

- name: Gunnery Shield
  slot: weapon
  location: Explorators vendor (Rep 23, PF 82) / Fellowship of the Void vendor (Rep 33, PF 115)
  act: 3
  description: +1 deflection. Reloading a shotgun costs 0 AP. First Shield Bash per turn costs 0 AP. Block chance 35%.
  category: Shield

