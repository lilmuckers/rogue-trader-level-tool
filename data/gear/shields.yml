# Shields — equipped in weapon slot (offhand)
# DLC: Lex Imperialis added shields as a weapon category
- name: Reflective Shield
  slot: weapon
  location: Fellowship of the Void vendor / Explorators vendor (early rep)
  act: 1
  description: +1 deflection. Shields allow blocking. First Shield Bash per turn costs 0 AP. Block chance 20%.
  category: Shield

- name: Iron Shield
  slot: weapon
  location: Carried by Boarder enemies / loot in Chasm / Pit Boss vendor (no rep required)
  act: 1
  description: Standard shield. First Shield Bash per turn costs 0 AP. Block chance 40%.
  category: Shield

- name: Old Shield
  slot: weapon
  location: Fellowship of the Void vendor (Rep 9, PF 36)
  act: 2
  description: Standard shield. First Shield Bash per turn costs 0 AP. Block chance 35%.
  category: Shield

- name: Heavy Shield
  slot: weapon
