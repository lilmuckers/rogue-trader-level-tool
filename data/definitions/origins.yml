    WILL: 5

Arbitrator:
  mc: true
  description: "An agent of the Adeptus Arbites, the Imperium's law enforcement. Investigators, enforcers, and judges combined."
  archetypes: [Operative]
  bonuses: {}
  bonus_note: "Origin bonuses not confirmed — check in-game character creation screen."

