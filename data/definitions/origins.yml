# Origin (background) characteristic bonuses, descriptions, and available archetypes
# Source: Fextralife Rogue Trader Wiki / Character Creation
# MC-available origins are marked mc: true
# Companion-exclusive origins have the companion noted

# ── MC Origins ────────────────────────────────────────────────────────────────

Imperial Navy Officer:
  mc: true
  description: "A seasoned officer of the Imperial Navy, trained in void warfare, command, and fleet tactics."
  archetypes: [Officer]
  bonuses:
    AGI: 5
    FEL: 5

Noble:
  mc: true
  description: "Born into the noble houses of the Imperium, schooled in politics, culture, and the art of command."
  archetypes: [Officer]
  bonuses:
    INT: 5
    FEL: 5

Astra Militarum Commander:
  mc: true
  description: "A veteran commander of the Imperial Guard, experienced in leading large forces in grinding attrition warfare."
