Finest Hour: >-
  Officer Heroic Action. The Officer immediately grants extra turns to up to (FEL bonus) allies, and increases their
  characteristics. Upgrades I-IV add additional effects each tier.
Daring Breach: >-
  Warrior Heroic Action. The Warrior immediately makes a free movement and attack against multiple enemies. Upgrades
  I-IV add additional damage, attacks, or stat bonuses each tier.
Firearm Mastery: >-
  Soldier Heroic Action. The Soldier immediately makes free attacks with their ranged weapon. Upgrades I-IV add
  additional shots, damage bonuses, or AP refunds each tier.
Dismantling Attack: >-
  Operative Heroic Action. The Operative makes a high-damage strike against a single target, ignoring defences. Upgrades
  I-IV add penetration, damage, or additional effects each tier.
Death Waltz: >-
  Bladedancer Heroic Action. The Bladedancer performs a sweeping melee strike against multiple foes with bonus damage.
  Upgrades I-IV improve range and damage each tier.
Press the Advantage: >-
  Master Tactician Heroic Action / Talent. Lets the Master Tactician spend Tactical Advantage stacks to grant powerful
  bonuses. Press the Advantage ignores cover and dodge.
Press The Advantage: >-
  Master Tactician Heroic Action / Talent. Lets the Master Tactician spend Tactical Advantage stacks to grant powerful
  bonuses. Press the Advantage ignores cover and dodge.
Tactical Advantage: >-
  Master Tactician core mechanic. The Master Tactician gains stacks of Tactical Advantage from momentum and spends them
  to fuel abilities and buffs.
Steady Superiority: Master Tactician talent / heroic action variant. Grants ongoing bonuses based on stacks of Tactical Advantage held.
Orchestrated Firestorm: >-
  Soldier / Heavy Gunner heroic action variant. Coordinated suppressing fire from the Soldier and allies; each tier
  increases area, damage, or AP cost.
Charge: >-
  Common combat action. The character moves directly to a target enemy and makes a melee attack with bonus damage based
  on distance moved. Available to all melee characters.
Bring it Down: >-
  Soldier / faith-based ability. Argenta-flavoured ability tied to Litany of Hatred / Sister of Battle: a powered-up
  burst attack against a marked target.
Bring it Down !: >-
  Soldier / faith-based ability. Argenta-flavoured ability tied to Litany of Hatred / Sister of Battle: a powered-up
  burst attack against a marked target.
Move, Move, Move: Officer ability. The Officer immediately grants an ally additional movement points.
Move, Move, Move!: Officer ability. The Officer immediately grants an ally additional movement points.
Revel in Slaughter: Bladedancer / melee talent. Grants bonus damage or stacking effects on each kill during a turn.
Camaraderie: Hive World origin talent. Hive world characters can pass Willpower resistance for an ally adjacent to them.
Trench Warfare: Soldier / Vanguard talent. Grants bonus deflection or armor while in cover.
Critical Versatility: Arch-Militant talent. Grants bonus critical hit chance based on stacks of Versatility.
Wildfire: Arch-Militant ability. The Arch-Militant's next attack will cost zero AP if it deals critical damage.
Wild Fire: Arch-Militant ability. The Arch-Militant's next attack will cost zero AP if it deals critical damage.
Wilfire: Arch-Militant ability. The Arch-Militant's next attack will cost zero AP if it deals critical damage.
Flash Fire: Soldier / pyromancer talent. Bonus burn damage or trigger AOE on critical hit.
Devastating Attack: Arch-Militant ability. The Arch-Militant's next attack, if it hits, deals significantly increased damage.
Devestating Attack: Arch-Militant ability. The Arch-Militant's next attack, if it hits, deals significantly increased damage.
Versatility: >-
  Arch-Militant core mechanic. Whenever the Arch-Militant uses an attack of a different type than the previous one, they
  gain a stack of Versatility for damage / AP refund.
Versitility: >-
  Arch-Militant core mechanic. Whenever the Arch-Militant uses an attack of a different type than the previous one, they
  gain a stack of Versatility for damage / AP refund.
Vesatility: >-
  Arch-Militant core mechanic. Whenever the Arch-Militant uses an attack of a different type than the previous one, they
  gain a stack of Versatility for damage / AP refund.
Critical Vesatility: Arch-Militant talent. Grants bonus critical hit chance based on stacks of Versatility.
Daring Breach II: >-
  (Warrior Heroic Action upgrade tier II) The Warrior immediately makes a free movement and attack. Tier II adds
  additional damage and effects.
Daring Breach IV: >-
  (Warrior Heroic Action upgrade tier IV) The Warrior immediately makes a free movement and attack. Tier IV is the
  strongest version with maximum bonuses.
Finest Hour I: (Officer Heroic Action upgrade tier I) Grants extra turns to allies. Tier I is the base upgrade.
Finest Hour IV: >-
  (Officer Heroic Action upgrade tier IV) Grants extra turns to allies. Tier IV is the strongest version with maximum
  bonuses.
