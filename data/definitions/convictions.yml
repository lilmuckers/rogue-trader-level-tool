# Conviction system — Dogmatic, Iconoclast, Heretic
# Sources: Fextralife Rogue Trader Wiki, GamerGuides.com
# Thresholds identical across all three paths.

system:
  description: >
    Convictions represent the Rogue Trader's moral and philosophical stance.
    Each significant story choice awards points toward one of three paths.
    Your active conviction is whichever path has the most accumulated points.
    Higher conviction levels unlock path-specific passive abilities that apply
    to the whole party, alter companion approval, and determine your ending.
  note: "Points accumulate across all paths — only the dominant one determines your tier."
  thresholds: [15, 75, 150, 300, 600]

paths:
  Dogmatic:
    icon: "☩"
    colour: gold
    philosophy: >
      Unwavering loyalty to the Emperor, the Ecclesiarchy, and Imperial law.
      Heresy, xenos, and chaos must be purged without mercy. The Imperium's
      survival demands absolute orthodoxy — any deviation invites damnation.
    approach: "Purge, obey, endure. The Emperor protects those who serve without question."
    companion_affinity:
      positive: [Argenta, Heinrix, Abelard]
      negative: [Idira, Yrliet, Marazhai]
    tiers:
      - rank: 1
        name: Follower
        points: 15
        ability: Grim Determination
        bonus: "+10% chance for the Rogue Trader and allies to survive a killing blow with 1 wound remaining."
      - rank: 2
        name: Adherent
        points: 75
        ability: Absolution
        bonus: "Critical hits in the first round of combat inflict Burning. Fire damage dealt to enemies is increased by +1 for each Dogmatic rank."
      - rank: 3
        name: Votary
        points: 150
        ability: Path of Redemption
        bonus: "Momentum expenditure for all abilities reduced by 20%."
      - rank: 4
        name: Fanatic
        points: 300
        ability: Piercing Resolution
        bonus: "Once per battle, one ally's weapon attacks ignore enemy armour for one round."
      - rank: 5
        name: Zealot
        points: 600
        ability: Instrument of His Will
        bonus: "Once per battle, all daemons and xenos within 5 cells are unable to attack the Rogue Trader for one round."

  Iconoclast:
    icon: "⚖"
    colour: silver
    philosophy: >
      The Imperium's methods are often cruel and counterproductive. Humanity
      survives through cooperation, pragmatism, and mercy — not blind dogma.
      Other races and renegades may be allies if approached without prejudice.
    approach: "Question authority. Protect people. Find a better way — even if the Imperium wouldn't approve."
    companion_affinity:
      positive: [Cassia, Jae, Yrliet, Pasqal]
      negative: [Argenta, Heinrix]
    tiers:
      - rank: 1
        name: Follower
        points: 15
        ability: Above the Thundering Guns
        bonus: "At the start of combat, the Rogue Trader gains temporary wounds equal to their Resolve."
      - rank: 2
        name: Adherent
        points: 75
        ability: Master of Command
        bonus: "Allies gain +(2 + Iconoclast rank) additional Movement Points in the first round of combat."
      - rank: 3
        name: Votary
        points: 150
        ability: Courage and Steel
        bonus: "Heroic acts cost 30 less Momentum to activate."
      - rank: 4
        name: Fanatic
        points: 300
        ability: Transcend the Potential
        bonus: "Once per battle, one ally can use a heroic act without spending Momentum."
      - rank: 5
        name: Zealot
        points: 600
        ability: Excellence
        bonus: "Allied attacks and abilities automatically succeed on dodge and resistance checks when targeting other allies."

  Heretic:
    icon: "✶"
    colour: blood
    philosophy: >
      The old ways are failing. True power lies in forbidden knowledge — the
      Ruinous Powers, xenos secrets, or pure nihilistic pragmatism. Survival
      at any cost, even if it means embracing what the Imperium fears most.
    approach: "Power is power. The weak cling to rules. The strong take what is needed."
    companion_affinity:
      positive: [Idira, Marazhai]
      negative: [Argenta, Heinrix, Abelard, Solomorne]
    tiers:
      - rank: 1
        name: Follower
        points: 15
        ability: Resource Preservation
        bonus: "+20% chance to save a combat stimulant or medikit when used (item is not consumed)."
      - rank: 2
        name: Adherent
        points: 75
        ability: Destroy the Weak
        bonus: "25% chance to regain 1 Action Point after killing an enemy in the first round of combat."
      - rank: 3
        name: Votary
        points: 150
        ability: Gifts of the Warp
        bonus: "Psychic phenomena now increase Momentum by 2–10 instead of decreasing it."
      - rank: 4
        name: Fanatic
        points: 300
        ability: Daemonopathy
        bonus: "Grant an ally +20 to all characteristics for 2 rounds. That ally falls prone when the effect ends."
      - rank: 5
        name: Zealot
        points: 600
        ability: Power From Beyond the Veil
        bonus: "Once per combat, all equipped weapons gain a warp-imbued bonus to their attacks."
