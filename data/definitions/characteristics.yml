# Skills
Medicae: "Governs healing effectiveness and injury treatment. Higher Medicae increases wounds restored by medkits and healing abilities."
Commerce: "Governs trade, profit factor negotiations, and Rogue Trader-specific social encounters."
Lore Imperium: "Knowledge of the Imperium's history and institutions. Required for many dialogue checks and scales some abilities."
Lore Xenos: "Knowledge of alien species and technology. Required for xenos-related checks and unlocks some item effects."
Lore Warp: "Knowledge of warp phenomena, daemons, and psychic entities. Required for warp-related checks."
Persuasion: "Convincing others through positive means - charm, reason, or bribery."
Coercion: "Intimidating or threatening others. Also scales some armour abilities and Commissar class effects."
Logic: "Analytical reasoning, code-breaking, and interacting with cogitators."
Tech-Use: "Operating, repairing, and interfacing with technology."
Awareness: "Detecting hidden enemies, noticing environmental details, and initiative tie-breaking."
Athletics: "Physical feats - climbing, jumping, and resisting knockdown."
Demolition: "Setting and disarming explosives."
Carouse: "Resisting poisons and intoxicants; social drinking; festive encounters."
Tracking: "Following trails and hunting quarry across environments."
Navigate Warp: "Guiding vessels through the immaterium. Required for warp navigation skill checks."
Xenos: "Lore (Xenos) - knowledge of alien species and technology."

# Action Points
AP +1: "Gains 1 additional Action Point per turn. Action Points (AP) are the primary combat resource - each attack, ability, or special action costs AP. One extra AP per turn is a significant combat advantage."
AP +2: "Gains 2 additional Action Points per turn. Action Points (AP) are the primary combat resource - extra AP directly translates to more attacks or abilities each round."
Ap +1: "Gains 1 additional Action Point per turn. Action Points (AP) are the primary combat resource - each attack, ability, or special action costs AP."
