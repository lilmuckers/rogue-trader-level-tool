# Primary Characteristics
Weapon Skill: "Governs melee attack accuracy and parry chance. Each point of WS Bonus (+1 per 10 WS) adds to melee hit chance and parry."
Ballistic Skill: "Governs ranged attack accuracy. Each point of BS Bonus (+1 per 10 BS) adds to ranged hit chance."
Strength: "Governs melee damage bonus and carrying capacity. Strength Bonus contributes to melee damage rolls."
Toughness: "Reduces incoming damage from all sources. Toughness Bonus adds to wound count and resistance to status effects."
Agility: "Governs dodge chance, movement points per turn, and initiative order. Agility Bonus directly increases dodge % and MP."
Perception: "Governs Awareness skill, initiative tie-breaking, and the ability to detect hidden enemies."
Willpower: "Governs psychic power strength, warp damage output, and resistance to mental effects. Willpower Bonus scales warp damage."
Fellowship: "Governs social skills and scales many Officer class abilities. Fellowship Bonus is used in voice-of-command and morale effects."
Intelligence: "Governs Tech-Use, Logic, and Lore skills. Intelligence Bonus scales some Operative and tech abilities."

